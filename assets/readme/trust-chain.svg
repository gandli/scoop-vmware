<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">从 archive.org 到 scoop 的可信链路</title>
  <desc id="d">四个阶段：archive.org 镜像元数据选出版本最大安装包，用 Broadcom 官方 SHA256 校验表取 hash，写成 manifest，由 GitHub Actions 每月提交，最后 scoop 安装时再校验一次。</desc>

  <rect width="1200" height="300" fill="#FAFAF8"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <!-- 1 -->
    <rect x="39" y="60" width="258" height="160" rx="12" fill="#FFFFFF" stroke="#D8D9DD"/>
    <text x="63" y="98" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#0F6CBD">01</text>
    <text x="63" y="136" font-size="23" font-weight="700" fill="#14161A">archive.org 镜像</text>
    <text x="63" y="168" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#6B7280">vmwareworkstationarchive</text>
    <text x="63" y="194" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#6B7280">160 个文件 · 只读 meta</text>

    <!-- 2 -->
    <rect x="327" y="60" width="258" height="160" rx="12" fill="#FFFFFF" stroke="#D8D9DD"/>
    <text x="351" y="98" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#0F6CBD">02</text>
    <text x="351" y="136" font-size="23" font-weight="700" fill="#14161A">选版本</text>
    <text x="351" y="168" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#6B7280">gen.py · pick_all()</text>
    <text x="351" y="194" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#6B7280">版本号最大 · 取新 build</text>

    <!-- 3 -->
    <rect x="615" y="60" width="258" height="160" rx="12" fill="#FFFFFF" stroke="#D8D9DD"/>
    <text x="639" y="98" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#0F6CBD">03</text>
    <text x="639" y="136" font-size="23" font-weight="700" fill="#14161A">官方 SHA256</text>
    <text x="639" y="168" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#6B7280">Broadcom API</text>
    <text x="639" y="194" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#6B7280">vmware-downloads 公开</text>

    <!-- 4 -->
    <rect x="903" y="60" width="258" height="160" rx="12" fill="#FFFFFF" stroke="#0F6CBD"/>
    <text x="927" y="98" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#0F6CBD">04</text>
    <text x="927" y="136" font-size="23" font-weight="700" fill="#14161A">manifest × 96</text>
    <text x="927" y="168" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#6B7280">Actions 自动提交</text>
    <text x="927" y="194" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#6B7280">scoop 装机时校验</text>
  </g>

  <!-- 连接箭头 -->
  <g stroke="#0F6CBD" stroke-width="2.5" fill="none">
    <path d="M303 140 h16 m0 0 l-7 -6 m7 6 l-7 6"/>
    <path d="M591 140 h16 m0 0 l-7 -6 m7 6 l-7 6"/>
    <path d="M879 140 h16 m0 0 l-7 -6 m7 6 l-7 6"/>
  </g>

  <text x="39" y="262" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#9CA3AF">全流程只读 metadata，不下载安装包；最新版缺官方 SHA256 时 CI 直接失败，不发布未验证的 hash</text>
</svg>